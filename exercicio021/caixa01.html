<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixa</title>
    <style>
        h1{
           background-color: lightgrey;
           height: 300px;
           width: 300px;
           border-width: 10px;
           border-style: solid;
           border-color: rgb(58, 55, 55);

           padding-top: 10px;
           padding-right: 10px;
           padding-bottom: 10px;
           padding-left: 10px;
        }
        a{
            border-width: 1,5px;
            border-style: solid;
            border-color: red;

            padding-top: 3px;
            padding-right: 3px;
            padding-bottom: 3px;
            padding-left: 3px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também ~sao exmplos de box-level, mas os <a href="#">links também são exemplos de caixas inline-level.</a>Vamos ver como tudo funciona.</p>
</body>
</html>
