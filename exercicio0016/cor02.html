<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiantes em css</title>
    <style>
        *{
          height: 100%;
        }
        body{
            background-image: linear-gradient(to bottom, #140c6b, #2517b7, #6158CC, #A9A1FF, #D7D4FF);
            background-attachment: fixed;
        }
        h1{
            color: antiquewhite;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiante</h1>
</body>
</html>
