<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: rgb(44, 166, 166);
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: brown;
        }
        a:hover{
            text-decoration: underline;
        }
        a:active{
            color: rgb(24, 232, 44);
        }
        a::after{
            content: ' ©';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.educacaoadventista.org.br/" target="_blank">Educação Adventista</a></li>
        <li><a href="https://www.youtube.com/@Motiva_K">Cananl do Youtube</a></li>
        <li><a href="https://github.com/?locale=pt-br">Site do GitHub</a></li>
    </ul>
</body>
</html>
